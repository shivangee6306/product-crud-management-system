server.port=8082

# ===== SQL Server connection (apna username/password yahan change karo) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ProductDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== Hibernate / JPA =====
# update = table apne aap ban jayegi (pehli baar run pe)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
